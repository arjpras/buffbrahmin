# Netlify deploy config for buffbrahmin / DesiFit Method

[build]
  publish = "."
  # No build command — pure static HTML/CSS/JS

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# Pretty URLs (so /plans works as well as /plans.html)
[[redirects]]
  from = "/plans"
  to = "/plans.html"
  status = 200

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200
